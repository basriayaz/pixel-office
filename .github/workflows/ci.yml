name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Locale files are valid JSON with the same keys
        run: node scripts/check-locales.mjs
      - name: Server starts, serves the UI and shuts down
        run: node scripts/smoke.mjs
        env:
          PIXEL_OFFICE_HOME: ${{ runner.temp }}/pixel-office-home
