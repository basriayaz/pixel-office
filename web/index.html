<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name" data-i18n="ui.brand">OFFICE</span>
    </div>
    <nav class="offices" id="offices" hidden></nav>
    <div class="tools">
      <button class="icon-btn small" id="btnOffices" data-i18n-title="ui.offices.manage">⚙</button>
      <span id="langHost"></span>
      <button class="icon-btn small" id="btnNotify" data-i18n-title="ui.notify.title">🔔</button>
      <button class="icon-btn small power" id="btnShutdown" data-i18n-title="ui.shutdown.btn">⏻</button>
    </div>
    <div class="legend">
      <span class="legend-item" data-i18n-tip="ui.legend.idle"><i class="dot idle"></i><span class="sr" data-i18n="ui.legend.idle"></span></span>
      <span class="legend-item" data-i18n-tip="ui.legend.working"><i class="dot working"></i><span class="sr" data-i18n="ui.legend.working"></span></span>
      <span class="legend-item" data-i18n-tip="ui.legend.waiting"><i class="dot waiting"></i><span class="sr" data-i18n="ui.legend.waiting"></span></span>
      <span class="legend-item" data-i18n-tip="ui.legend.error"><i class="dot error"></i><span class="sr" data-i18n="ui.legend.error"></span></span>
    </div>
    <a class="btn primary small" id="hireLink" href="hire.html" data-i18n="ui.hireButton">+ Hire</a>
    <div class="clock" id="clock">--:--</div>
  </header>

  <main class="stage">
    <div class="offline-banner" data-i18n="ui.offlineBanner"></div>
    <div class="office-wrap" id="officeWrap">
      <canvas id="office"></canvas>
      <div class="labels" id="labels"></div>
    </div>
    <div class="roster" id="roster"></div>
  </main>

  <aside class="chat" id="chat">
    <div class="chat-head">
      <a class="chat-avatar" id="chatAvatar" href="#" data-i18n-title="ui.chat.profile"></a>
      <div class="chat-title">
        <div class="chat-name"><span id="chatName">—</span><span class="model-badge" id="chatModel"></span></div>
        <div class="chat-role" id="chatRole">—</div>
      </div>
      <span class="chip" id="chatStatus"></span>
      <a class="icon-btn" id="btnProfile" href="#" data-i18n-title="ui.chat.profile">☰</a>
      <button class="icon-btn" id="btnStop" data-i18n-title="ui.chat.stop">■</button>
      <button class="icon-btn" id="btnReset" data-i18n-title="ui.chat.reset">⟲</button>
      <button class="icon-btn" id="btnClose" data-i18n-title="ui.chat.close">×</button>
    </div>
    <div class="chat-body" id="chatBody"></div>
    <form class="chat-foot" id="chatForm">
      <textarea id="chatInput" rows="1" data-i18n-ph="ui.chat.placeholder"></textarea>
      <button type="submit" id="btnSend" title="Enter">➤</button>
    </form>
    <div class="chat-hint" data-i18n="ui.chat.hint"></div>
  </aside>

  <div class="modal" id="officesModal" hidden>
    <div class="modal-card">
      <div class="modal-head"><h2 data-i18n="ui.offices.manage"></h2><button class="icon-btn" id="officesClose" data-i18n-title="ui.offices.close">×</button></div>
      <div class="office-list" id="officeList"></div>
      <h3 data-i18n="ui.offices.add"></h3>
      <form id="officeAdd" class="office-add">
        <label class="field"><span data-i18n="ui.offices.name"></span><input id="oName" required maxlength="60" data-i18n-ph="ui.offices.namePh" /></label>
        <label class="field"><span data-i18n="ui.offices.cwd"></span><input id="oCwd" maxlength="500" data-i18n-ph="ui.offices.cwdPh" /><small data-i18n="ui.offices.cwdHint"></small></label>
        <div class="field"><span data-i18n="ui.themes.label"></span><div class="theme-cards" id="oTheme"></div></div>
        <div class="actions"><button class="btn primary" type="submit" data-i18n="ui.offices.add"></button></div>
      </form>
    </div>
  </div>

  <div class="modal" id="shutdownModal" hidden>
    <div class="modal-card narrow">
      <div class="modal-head"><h2 data-i18n="ui.shutdown.title"></h2><button class="icon-btn" id="shutdownClose" data-i18n-title="ui.shutdown.cancel">×</button></div>
      <p class="muted" data-i18n="ui.shutdown.body"></p>
      <div class="actions right">
        <button class="btn ghost" id="shutdownCancel" data-i18n="ui.shutdown.cancel"></button>
        <button class="btn danger" id="shutdownConfirm" data-i18n="ui.shutdown.confirm"></button>
      </div>
    </div>
  </div>

  <div class="modal" id="welcomeModal" hidden>
    <div class="modal-card narrow welcome">
      <h2 data-i18n="ui.welcome.title"></h2>
      <p class="muted" data-i18n="ui.welcome.intro"></p>
      <ol>
        <li data-i18n="ui.welcome.s1"></li>
        <li data-i18n="ui.welcome.s2"></li>
        <li data-i18n="ui.welcome.s3"></li>
      </ol>
      <div class="actions right"><button class="btn primary" id="welcomeGo" data-i18n="ui.welcome.cta"></button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/i18n.js"></script>
  <script src="office.js"></script>
  <script src="shared.js"></script>
  <script src="app.js"></script>
</body>
</html>
